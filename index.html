<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Email OTP Verification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function () {
      emailjs.init("4_CqucsGov_ltiTmx"); // ✅ REQUIRED
    })();
  </script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, Arial;
      background: #f4f4f4;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #fb8500;
      font-weight: 700;
      cursor: pointer;
    }

    .hidden { display: none; }
  </style>
</head>

<body>

<div class="card">
  <h3>I truly appreciate your time and consideration, Please proceed with Email Verification, Thanks!</h3>

  <!-- STEP 1 -->
  <div id="step1">
    <input id="name" placeholder="Your name" />
    <input id="email" type="email" placeholder="Your email" />
    <button id="sendOtpBtn">Send OTP</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="hidden">
    <p>OTP sent to your email</p>
    <input id="otpInput" placeholder="Enter OTP" />
    <button id="verifyOtpBtn">Verify & Continue</button>
  </div>
</div>

<script>
  let generatedOtp = null;
  let userName = "";
  let userEmail = "";

  // SEND OTP
  document.getElementById("sendOtpBtn").addEventListener("click", () => {
    userName = document.getElementById("name").value.trim();
    userEmail = document.getElementById("email").value.trim();

    if (!userName || !userEmail) {
      alert("Please enter name and email");
      return;
    }

    generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

    emailjs.send(
      "service_wcdlozi",
      "template_g6cn38p",
      {
        otp: generatedOtp,
        email: userEmail
      }
    ).then(() => {
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
      alert("OTP sent to your email");
    }).catch(err => {
      console.error(err);
      alert("Invalid Email Id");
    });
  });


  document.getElementById("verifyOtpBtn").addEventListener("click", () => {
    const enteredOtp = document.getElementById("otpInput").value.trim();

    if (enteredOtp !== generatedOtp) {
      alert("Invalid OTP");
      return;
    }

    localStorage.setItem("verified", "yes");

    emailjs.send(
      "service_wcdlozi",
      "template_eyb2jb1",
      {

        name: userName,
        email: userEmail,
      }
    ).then(() => {
      alert("Thanks for Waiting, Your Email is Successfuly Verified!");
      window.location.href = "resume.html";
    }).catch(err => {
      console.error("Confirmation email error:", err);
      alert("Verified, but confirmation email failed");
      window.location.href = "resume.html";
    });
  });
</script>



</body>
</html>
