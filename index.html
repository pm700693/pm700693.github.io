<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Your Name — Personal Website & CV</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <!-- AOS for scroll animations -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <!-- Font Awesome (FIXED – CDN, WORKS) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Meta for theme-color on mobile -->
  <meta name="theme-color" content="#eaf6ff" />

  <style>
    :root{
      --bg:#eaf6ff;        /* light blue */
      --yellow:#fff6cc;   /* soft yellow */
      --card:#ffffff;
      --muted:#50667a;
      --accent:#2563eb;
      --accent-2:#06b6d4;
      --glass:rgba(37,99,235,0.04);
      --glass-2:rgba(2,6,23,0.03);
      --text:#072034;
      --mono:'Inter',system-ui;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family:var(--mono);
      color:var(--text);
      background:
        radial-gradient(circle at top left, var(--yellow), transparent 40%),
        radial-gradient(circle at bottom right, rgba(37,99,235,.12), transparent 45%),
        linear-gradient(180deg,var(--bg),#ffffff 60%);
      line-height:1.45;
      overflow-x:hidden;
    }

    .bg-blob{
      position:fixed;
      right:-120px;
      top:-80px;
      width:360px;
      height:360px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      filter:blur(48px);
      opacity:.12;
      pointer-events:none;
      animation:blobMove 18s ease-in-out infinite alternate;
    }
    .bg-blob--small{
      left:-80px;
      bottom:-60px;
      width:260px;
      height:260px;
      animation-duration:22s;
      opacity:.08;
    }
    @keyframes blobMove{
      to{transform:translateY(36px) translateX(-18px) scale(1.08)}
    }

    .container{max-width:1100px;margin:32px auto;padding:24px}
    header{display:flex;justify-content:space-between;align-items:center;gap:16px}

    .brand{display:flex;gap:12px;align-items:center}
    .logo{
      width:56px;height:56px;border-radius:12px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--accent),#3b82f6);
      box-shadow:0 10px 30px rgba(37,99,235,.2)
    }

    h1{margin:0;font-size:1.12rem;font-weight:800}
    p.lead{margin:0;color:var(--muted)}

    .btn{
      background:transparent;
      border:1px solid rgba(0,0,0,.08);
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      display:inline-flex;
      gap:8px;
      align-items:center;
    }

    main{
      display:grid;
      grid-template-columns:1fr 380px;
      gap:28px;
      margin-top:28px;
    }

    .card{
      background:var(--card);
      border-radius:16px;
      padding:22px;
      box-shadow:0 12px 30px rgba(0,0,0,.08);
      border:1px solid rgba(0,0,0,.05);
    }

    .hero{display:flex;gap:20px;align-items:center}
    .avatar{
      width:128px;height:128px;border-radius:16px;
      overflow:hidden;
      box-shadow:0 8px 26px rgba(37,99,235,.25);
    }
    .avatar img{width:100%;height:100%;object-fit:cover}

    .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .pill{
      padding:8px 10px;
      border-radius:999px;
      background:rgba(37,99,235,.08);
      font-size:.85rem;
      font-weight:600;
    }

    .section{margin-top:22px}
    .faint{opacity:.75}

    .skills{display:flex;gap:10px;flex-wrap:wrap}
    .skill{min-width:120px}
    .bar{
      height:10px;
      background:#e5e7eb;
      border-radius:999px;
      overflow:hidden;
      margin-top:8px;
    }
    .bar i{
      display:block;
      height:100%;
      width:0%;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      transition:width .9s ease;
    }

    aside{position:sticky;top:28px}

    footer{
      margin-top:32px;
      text-align:center;
      color:var(--muted);
    }

    @media(max-width:980px){
      main{grid-template-columns:1fr}
      aside{position:static}
    }
  </style>
</head>

<body>

<div class="bg-blob"></div>
<div class="bg-blob bg-blob--small"></div>

<div class="container">

<header>
  <div class="brand">
    <div class="logo">YN</div>
    <div>
      <h1>Your Name</h1>
      <p class="lead">Product Designer · Front-end Engineer</p>
    </div>
  </div>
  <button class="btn"><i class="fa fa-file-pdf"></i> Download CV</button>
</header>

<main>
<section>
  <div class="card" data-aos="fade-up">
    <div class="hero">
      <div class="avatar">
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=800">
      </div>
      <div>
        <h2>Hi, I'm Your Name — <span id="dynamicText"></span></h2>
        <p class="faint">I build delightful, accessible web experiences.</p>

        <div class="pills">
          <span class="pill">Available</span>
          <span class="pill">Remote</span>
          <span class="pill">India</span>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Skills</h3>
      <div class="skills" id="skills">
        <div class="skill">React<div class="bar"><i data-fill="85%"></i></div></div>
        <div class="skill">TypeScript<div class="bar"><i data-fill="80%"></i></div></div>
        <div class="skill">CSS<div class="bar"><i data-fill="75%"></i></div></div>
      </div>
    </div>
  </div>
</section>

<aside>
  <div class="card">
    <h3>Contact</h3>
    <p><i class="fa fa-envelope"></i> you@domain.com</p>
    <p><i class="fa fa-linkedin"></i> LinkedIn</p>
    <p><i class="fa fa-github"></i> GitHub</p>
  </div>
</aside>
</main>

<footer>© <span id="year"></span> Your Name</footer>

</div>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<script>
AOS.init();
document.getElementById('year').textContent=new Date().getFullYear();

const texts=[
  'Frontend Engineer.',
  'UI / UX Designer.',
  'Performance Focused.'
];
let t=0,i=0,dir=1;
const el=document.getElementById('dynamicText');

function type(){
  el.textContent=texts[t].slice(0,i);
  i+=dir;
  if(i>texts[t].length){dir=-1;setTimeout(type,1000);return;}
  if(i<0){dir=1;t=(t+1)%texts.length;}
  setTimeout(type,dir>0?70:40);
}
type();

gsap.registerPlugin(ScrollTrigger);
ScrollTrigger.create({
  trigger:'#skills',
  start:'top 85%',
  onEnter:()=>{
    document.querySelectorAll('.bar i').forEach(b=>{
      b.style.width=b.dataset.fill;
    });
  }
});
</script>

</body>
</html>
